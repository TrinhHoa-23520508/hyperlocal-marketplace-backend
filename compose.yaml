# Local development services, started automatically by spring-boot-docker-compose.
# Values come from .env; the defaults match .env.example.
services:
  postgres:
    image: 'imresamu/postgis:17-3.5'
    labels:
      org.springframework.boot.service-connection: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nearby}
      POSTGRES_USER: ${POSTGRES_USER:-nearby}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nearby}
    ports:
      # Not 5432: a PostgreSQL installed directly on the host usually owns that port.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: 'redis:7.4-alpine'
    ports:
      - '${REDIS_PORT:-6379}:6379'
  rabbitmq:
    # STOMP broker relay for chat across application replicas (ADR-13).
    image: 'rabbitmq:4-management-alpine'
    # The STOMP plugin is not enabled in the stock image.
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp &&
      exec docker-entrypoint.sh rabbitmq-server"
    labels:
      org.springframework.boot.ignore: true
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nearby}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-nearby-secret}
    ports:
      - '${RABBITMQ_AMQP_PORT:-5672}:5672'
      - '${RABBITMQ_STOMP_PORT:-61613}:61613'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
  minio:
    # Community build: upstream MinIO stopped publishing Docker images.
    image: 'pgsty/minio:RELEASE.2026-08-04T00-00-00Z'
    command: server /data --console-address ":9001"
    labels:
      org.springframework.boot.ignore: true
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-nearby}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-nearby-secret}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - miniodata:/data

  # Monitoring, off by default: docker compose --profile monitoring up -d
  # Prometheus http://localhost:9090, Grafana http://localhost:3000 (admin / admin)
  prometheus:
    image: 'prom/prometheus:v3.4.1'
    profiles: ['monitoring']
    labels:
      org.springframework.boot.ignore: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./deploy/prometheus/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
  grafana:
    image: 'grafana/grafana:12.0.2'
    profiles: ['monitoring']
    labels:
      org.springframework.boot.ignore: true
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
  miniodata:
