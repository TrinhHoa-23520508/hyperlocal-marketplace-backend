spring:
  application:
    name: nearby-backend
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:nearby}}
    username: ${DB_USERNAME:${POSTGRES_USER:nearby}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:nearby}}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  jackson:
    default-property-inclusion: non_null

  mvc:
    problemdetails:
      enabled: true

  web:
    error:
      include-stacktrace: never

  servlet:
    multipart:
      enabled: false

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true
      completion-mode: update

  docker:
    compose:
      lifecycle-management: start-only

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    mail:
      enabled: ${MAIL_ENABLED:false}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Buckets for p95/p99 latency panels and alerts in Grafana / Prometheus
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  datasource:
    read:
      # Read replica for read-only transactions such as discovery (FR-DC-12). Empty = use the primary.
      url: ${DB_READ_URL:}
      username: ${DB_READ_USERNAME:${spring.datasource.username}}
      password: ${DB_READ_PASSWORD:${spring.datasource.password}}
      maximum-pool-size: ${DB_READ_POOL_SIZE:10}
      # Wait this long for the replica, then fall back to the primary.
      connection-timeout: ${DB_READ_CONNECTION_TIMEOUT:2s}
  cors:
    # Comma-separated browser origins, e.g. the admin console. Empty = CORS off.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-secret-change-me-please-32b+}
      issuer: ${JWT_ISSUER:nearby-backend}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${app.storage.endpoint}}
    access-key: ${MINIO_ACCESS_KEY:nearby}
    secret-key: ${MINIO_SECRET_KEY:nearby-secret}
    bucket: ${MINIO_BUCKET:nearby-images}
    region: ${MINIO_REGION:us-east-1}
    presign-ttl: ${MINIO_PRESIGN_TTL:10m}
  websocket:
    relay:
      # true: STOMP messages go through the RabbitMQ broker relay so two replicas can reach each other's users (ADR-13).
      enabled: ${WS_RELAY_ENABLED:true}
      host: ${RABBITMQ_HOST:localhost}
      port: ${RABBITMQ_STOMP_PORT:61613}
      client-login: ${RABBITMQ_USER:nearby}
      client-passcode: ${RABBITMQ_PASSWORD:nearby-secret}
      system-login: ${RABBITMQ_USER:nearby}
      system-passcode: ${RABBITMQ_PASSWORD:nearby-secret}
      virtual-host: ${RABBITMQ_VHOST:/}
  push:
    fcm:
      # Path of the Firebase service account JSON file. Empty = pushes are logged and marked SKIPPED (local development, CI).
      credentials: ${FCM_CREDENTIALS:}
      base-url: ${FCM_BASE_URL:https://fcm.googleapis.com}
      # FCM never slows a business flow (FR-NT-02): one send waits at most this long.
      timeout: ${FCM_TIMEOUT:5s}
  idempotency:
    ttl: ${IDEMPOTENCY_TTL:24h}
  mail:
    # false: emails are written to the log instead of being sent (local development).
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@nearby.local}
  sms:
    # log: one-time codes are written to the log (local development); esms: sent by eSMS.vn
    provider: ${SMS_PROVIDER:log}
    esms:
      base-url: ${ESMS_BASE_URL:https://rest.esms.vn/MainService.svc/json}
      api-key: ${ESMS_API_KEY:}
      secret-key: ${ESMS_SECRET_KEY:}
      brandname: ${ESMS_BRANDNAME:}
      sms-type: ${ESMS_SMS_TYPE:2}
      # true: eSMS validates the request without delivering or charging
      sandbox: ${ESMS_SANDBOX:false}
      timeout: ${ESMS_TIMEOUT:10s}
  identity:
    # The token is appended as ?token=...; the app or web page posts it back to the API.
    email-verification-url: ${EMAIL_VERIFICATION_URL:nearby://verify-email}
    password-reset-url: ${PASSWORD_RESET_URL:nearby://reset-password}
    otp:
      hash-secret: ${OTP_HASH_SECRET:local-dev-otp-secret-change-me-please-32b+}
      # Must match the template registered with the SMS provider; {code} is the 6-digit code.
      sms-template: ${SMS_OTP_TEMPLATE:{code} la ma xac minh Nearby cua ban, het han sau 5 phut. Khong chia se ma nay.}
    bootstrap-admin:
      # Created on startup when both are set and no account uses the email yet.
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
      display-name: ${ADMIN_DISPLAY_NAME:Nearby Admin}

logging:
  level:
    vn.edu.uit.nearby: INFO
