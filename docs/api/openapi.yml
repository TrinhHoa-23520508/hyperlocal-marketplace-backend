    post:
      tags:
      - Areas
      summary: "Verify a new area, or replace one, with a fresh GPS fix (UC-AR-01,\
        \ UC-AR-03)"
      description: "201 creates an area. 200 means the fix was within 1 500 m of an\
        \ existing area, which was renewed instead (UC-AR-01 A4)."
      operationId: verify
      parameters:
      - name: Idempotency-Key
        in: header
        description: UUID; resending the same key and body returns the stored response
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyAreaRequest"
        required: true
      responses:
        "201":
          description: A new area was verified
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AreaVerificationResponse"
        "200":
          description: An existing area was renewed instead
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AreaVerificationResponse"
        "403":
          description: "LOCATION_CONSENT_REQUIRED: no PRECISE_LOCATION consent | ACCESS_DENIED:\
            \ the account is not ACTIVE or has no verified phone"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "AREA_NOT_FOUND: replaceAreaId is not one of the caller's areas"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "AREA_LIMIT_REACHED: already 2 areas; areaIds lists them for\
            \ UC-AR-03 | AREA_HAS_OPEN_TRANSACTIONS: the replaced area's listings\
            \ have open transactions | AREA_STATUS_CONFLICT: the replaced area was\
            \ removed | IDEMPOTENCY_CONFLICT | DUPLICATE_REQUEST"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "AREA_VERIFICATION_REJECTED: reasons MOCK_LOCATION, LOW_ACCURACY,\
            \ STALE_FIX, IMPOSSIBLE_SPEED with guidance | OUT_OF_RENEW_RADIUS: when\
            \ renewing a nearby area"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: "AREA_RATE_LIMITED: reason DAILY_ATTEMPTS (5 a day) or AREA_CHANGES\
            \ (3 per 30 days); Retry-After header"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: "VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
