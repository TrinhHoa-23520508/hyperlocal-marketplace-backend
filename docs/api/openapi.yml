  /api/v1/search:
    get:
      tags:
      - Discovery
      summary: "Search with keyword, filters and sort, 20 a page (UC-DC-02, A07/A08)"
      operationId: search
      parameters:
      - name: q
        in: query
        description: Keyword; accents and case are ignored ("ao khoac" finds "Áo khoác")
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 0
      - name: categoryId
        in: query
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int32
      - name: minPrice
        in: query
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
      - name: maxPrice
        in: query
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
      - name: condition
        in: query
        description: "Repeat for several: condition=NEW&condition=LIKE_NEW"
        required: false
        schema:
          type:
          - array
          - "null"
          items:
            type: string
            enum:
            - NEW
            - LIKE_NEW
            - USED
            - WORN
      - name: freeOnly
        in: query
        description: Only free items (price 0)
        required: false
        schema:
          type:
          - boolean
          - "null"
      - name: radiusKm
        in: query
        description: "1-20; outside values are clamped and flagged; default: the range\
          \ of the center"
        required: false
        schema:
          type:
          - number
          - "null"
          format: double
          exclusiveMinimum: 0
      - name: includeSold
        in: query
        description: Also SOLD listings
        required: false
        schema:
          type:
          - boolean
          - "null"
      - name: sort
        in: query
        description: "NEWEST (default), NEAREST or RELEVANT"
        required: false
        schema:
          type:
          - string
          - "null"
          enum:
          - NEAREST
          - NEWEST
          - RELEVANT
      - name: lat
        in: query
        required: false
        schema:
          type:
          - number
          - "null"
          format: double
          maximum: 90.0
          minimum: -90.0
      - name: lon
        in: query
        required: false
        schema:
          type:
          - number
          - "null"
          format: double
          maximum: 180.0
          minimum: -180.0
      - name: rangeLevel
        in: query
        required: false
        schema:
          type:
          - string
          - "null"
      - name: cursor
        in: query
        description: nextCursor of the previous page of the same search
        required: false
        schema:
          type:
          - string
          - "null"
      responses:
        "400":
          description: "VALIDATION_FAILED: minPrice above maxPrice, unknown category\
            \ or sort, no center | INVALID_RANGE | INVALID_CURSOR"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: []
  /api/v1/map/listings:
    get:
      tags:
      - Discovery
      summary: "Map markers for a viewport: up to 200 points, otherwise clusters (UC-DC-03,\
        \ A09)"
      operationId: map
      parameters:
      - name: south
        in: query
        required: true
        schema:
          type: number
          format: double
          maximum: 90.0
          minimum: -90.0
      - name: west
        in: query
        required: true
        schema:
          type: number
          format: double
          maximum: 180.0
          minimum: -180.0
      - name: north
        in: query
        required: true
        schema:
          type: number
          format: double
          maximum: 90.0
          minimum: -90.0
      - name: east
        in: query
        required: true
        schema:
          type: number
          format: double
          maximum: 180.0
          minimum: -180.0
      - name: zoom
        in: query
        description: "Map zoom level, 0-22"
        required: true
        schema:
          type: integer
          format: int32
          maximum: 22
          minimum: 0
      - name: categoryId
        in: query
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int32
      - name: minPrice
        in: query
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
      - name: maxPrice
        in: query
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
      - name: freeOnly
        in: query
        required: false
        schema:
          type:
          - boolean
          - "null"
      responses:
        "400":
          description: "VALIDATION_FAILED: viewport or zoom"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: []
  /api/v1/listings/posting-eligibility:
    get:
      tags:
      - Listings
      summary: "Whether the caller may post now: trading gate and remaining quota\
        \ (UC-LS-01 step 1)"
      operationId: postingEligibility
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PostingEligibilityResponse"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/listings/me:
    get:
      tags:
      - Listings
      summary: "The caller's listings by state, with counters (UC-LS-07, A14)"
      operationId: myListings
      parameters:
      - name: status
        in: query
        description: "Tab filter, repeatable; default every state but DELETED"
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - PENDING_REVIEW
            - ACTIVE
            - RESERVED
            - SOLD
            - HIDDEN
            - DELETED
            - REMOVED
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "400":
          description: "INVALID_CURSOR | VALIDATION_FAILED: unknown status"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/listings/images/{imageId}:
    get:
      tags:
      - Listing images
      summary: Processing status of an uploaded image (UC-LS-01 A5)
      operationId: status
      parameters:
      - name: imageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: "IMAGE_NOT_FOUND: not one of the caller's images"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/feed:
    get:
      tags:
      - Discovery
      summary: "Nearby feed: ACTIVE and RESERVED listings, newest or bumped first,\
        \ 20 a page (UC-DC-01, A06)"
      description: "Centered on lat/lon (GPS or picked point) with rangeLevel, or\
        \ on the caller's active area. Guests must send lat and lon."
      operationId: feed
      parameters:
      - name: lat
        in: query
        description: Latitude of a GPS position or picked point; with lon
        required: false
        schema:
          type:
          - number
          - "null"
          format: double
          maximum: 90.0
          minimum: -90.0
      - name: lon
        in: query
        description: Longitude; with lat
        required: false
        schema:
          type:
          - number
          - "null"
          format: double
          maximum: 180.0
          minimum: -180.0
      - name: rangeLevel
        in: query
        description: "NEAR, MEDIUM or FAR (2/4/6 km) for a point; default MEDIUM"
        required: false
        schema:
          type:
          - string
          - "null"
      - name: cursor
        in: query
        description: nextCursor of the previous page
        required: false
        schema:
          type:
          - string
          - "null"
      responses:
        "400":
          description: "VALIDATION_FAILED: no center (field center) or bad values\
            \ | INVALID_RANGE: rangeLevel | INVALID_CURSOR: reload from the first\
            \ page"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: []
  /api/v1/categories:
    get:
      tags:
      - Discovery
      summary: "Active categories in display order (A08, A12)"
      operationId: categories
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CategoryResponse"
      security: []
  /api/v1/areas/me:
    get:
      tags:
      - Areas
      summary: The caller's areas in slot order (A27)
      operationId: listMyAreas
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaResponse"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/admin/users:
    get:
      tags:
      - "Admin: users"
      summary: "Search accounts by phone, email or display name, newest first"
      operationId: searchUsers
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - BANNED
          - PENDING_DELETION
          - DELETED
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "400":
          description: INVALID_CURSOR
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/admin/users/{userId}:
    get:
      tags:
