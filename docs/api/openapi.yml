openapi: 3.1.0
info:
  title: Nearby API
  description: "Hyperlocal second-hand marketplace. Errors follow RFC 9457 (application/problem+json)\
    \ with a stable `code`; lists use cursor-based pagination; state-changing calls\
    \ accept an Idempotency-Key header. Business flows per screen: docs/api/<module>-api.md."
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Authentication
  description: "Phone registration with SMS codes, login, tokens, password reset and\
    \ email verification"
- name: Consents
  description: Consent per purpose and marketing pushes (FR-ID-15)
- name: Profile
  description: The current user's profile and avatar (FR-ID-03)
- name: Account security
  description: "The current user's password, optional email address and account deletion"
- name: Areas
  description: "GPS-verified activity areas (FR-AR-01..09; screens A27, A28)"
- name: Trading gate
  description: "Conditions to post listings, chat and make offers (FR-ID-20)"
- name: Blocks
  description: Block and unblock other users (FR-ID-14)
- name: "Admin: users"
  description: "Find accounts, suspend, ban and lift sanctions (FR-ID-19, UC-AD-04)"
- name: Public profiles
  description: What anyone can see about a user (FR-ID-13)
- name: Location consent
  description: Consent to location data processing (FR-ID-06)
paths:
  /api/v1/users/me:
    get:
      tags:
      - Profile
      summary: Get the current user's profile
      operationId: getProfile
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags:
      - Profile
      summary: Update display name and default area; the area is rounded before it
        is stored
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "422":
          description: "NAME_CHANGE_TOO_SOON: nextAllowedAt says when the name can\
            \ change again"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: "VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags:
      - Account security
      summary: "Delete the account: anonymised after the grace period unless the user\
        \ logs in again (FR-ID-16)"
      operationId: deleteAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
        required: true
      responses:
        "400":
          description: "CURRENT_PASSWORD_INVALID | VALIDATION_FAILED: errors lists\
            \ each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: CANNOT_DELETE_ADMIN
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: ACCOUNT_DELETION_BLOCKED (blockers lists open obligations)
            | ACCOUNT_STATUS_CONFLICT
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountDeletionResponse"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/me/password:
    put:
      tags:
      - Account security
      summary: "Change the password; other devices are logged out, this one stays\
        \ (FR-ID-08)"
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "400":
          description: "CURRENT_PASSWORD_INVALID | PASSWORD_REUSED | WEAK_PASSWORD\
            \ | VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "204":
          description: No Content
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/me/location-consent:
    get:
      tags:
      - Location consent
      summary: Get the current consent and the terms version clients must show
      operationId: getConsent
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationConsentResponse"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags:
      - Location consent
      summary: Give consent to the current terms version
      operationId: grantConsent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationConsentRequest"
        required: true
      responses:
        "400":
          description: "OUTDATED_TERMS_VERSION: termsVersion is not the current one\
            \ | VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags:
      - Location consent
      summary: Withdraw consent; precise locations are no longer collected
      operationId: withdrawConsent
      responses:
        "204":
          description: No Content
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/me/email:
    put:
      tags:
      - Account security
      summary: Add or replace the optional email address and send a verification link
        (FR-ID-09)
      operationId: changeEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailRequest"
        required: true
      responses:
        "409":
          description: "EMAIL_UNAVAILABLE: another account uses the address"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "202":
          description: Accepted
        "400":
          description: "VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/me/consents/push-marketing:
    put:
      tags:
      - Consents
      summary: Agree to marketing pushes
      operationId: grantPushMarketing
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ConsentResponse"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags:
      - Consents
      summary: Withdraw consent to marketing pushes
      operationId: withdrawPushMarketing
      responses:
        "204":
          description: No Content
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/me/blocks/{userId}:
    put:
      tags:
      - Blocks
      summary: Block a user; blocking again changes nothing
      operationId: block
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "400":
          description: CANNOT_BLOCK_SELF
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "USER_NOT_FOUND: unknown or deleted account"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "204":
          description: No Content
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags:
      - Blocks
      summary: Unblock a user; unblocking a user who is not blocked changes nothing
      operationId: unblock
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/me/avatar:
    put:
      tags:
      - Profile
      summary: "Step 2 of an avatar change: confirm the uploaded image"
      operationId: confirmAvatar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmAvatarRequest"
        required: true
      responses:
        "400":
          description: "INVALID_AVATAR_KEY | AVATAR_NOT_UPLOADED | INVALID_IMAGE (the\
            \ upload is deleted) | VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags:
      - Profile
      summary: Remove the avatar
      operationId: removeAvatar
      responses:
        "204":
          description: No Content
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/areas/active:
    put:
      tags:
      - Areas
      summary: Choose the area that drives the feed and its range (UC-AR-04)
      operationId: selectActive
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectActiveAreaRequest"
        required: true
      responses:
        "400":
          description: "INVALID_RANGE: rangeLevel is not NEAR, MEDIUM or FAR | VALIDATION_FAILED:\
            \ errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "AREA_NOT_FOUND: not one of the caller's areas"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "AREA_STATUS_CONFLICT: only a VERIFIED or EXPIRING area"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/me/email/verification:
    post:
      tags:
      - Account security
      summary: Send a new verification link to the unverified email address (FR-ID-09)
      operationId: resendEmailVerification
      responses:
        "400":
          description: "EMAIL_NOT_SET: the account has no email"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "202":
          description: Accepted
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/me/avatar/upload-url:
    post:
      tags:
      - Profile
      summary: "Step 1 of an avatar change: get a presigned upload URL"
      operationId: createAvatarUploadUrl
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarUploadUrlRequest"
        required: true
      responses:
        "400":
          description: "INVALID_IMAGE: not JPEG, PNG or WebP, or over 5 MB | VALIDATION_FAILED:\
            \ errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      summary: "Register with the phone number, the SMS code and the accepted policies\
        \ (FR-ID-01)"
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "400":
          description: "WEAK_PASSWORD (violations lists every rule) | INVALID_PHONE\
            \ | VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: PHONE_ALREADY_REGISTERED (only after a correct code) | POLICY_VERSION_STALE
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: CONSENT_REQUIRED | OTP_INVALID (remainingAttempts) | OTP_EXPIRED
            | OTP_ATTEMPTS_EXCEEDED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: "RATE_LIMITED: too many registrations from this IP; see Retry-After"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RegistrationResponse"
      security: []
  /api/v1/auth/register/otp:
    post:
      tags:
      - Authentication
      summary: Send the 6-digit registration code by SMS (FR-ID-02)
      operationId: sendRegistrationCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOtpRequest"
        required: true
      responses:
        "400":
          description: "INVALID_PHONE: not a Vietnamese mobile number | VALIDATION_FAILED:\
            \ errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: "OTP_RATE_LIMITED: inside the 60 s resend interval or over\
            \ 5 codes per day; see Retry-After"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "SMS_UNAVAILABLE: the SMS gateway failed; the daily quota is\
            \ not used"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OtpChallengeResponse"
      security: []
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Exchange a refresh token for a new token pair; the old refresh token
        is revoked (FR-ID-04)
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "401":
          description: INVALID_REFRESH_TOKEN | REFRESH_TOKEN_REUSED (the whole session
            is revoked)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: ACCOUNT_SUSPENDED | ACCOUNT_BANNED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: "VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: []
  /api/v1/auth/password/verify-otp:
    post:
      tags:
      - Authentication
      summary: Exchange the SMS reset code for a single-use reset token (FR-ID-07)
      operationId: verifyResetCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyResetCodeRequest"
        required: true
      responses:
        "422":
          description: OTP_INVALID (remainingAttempts) | OTP_EXPIRED | OTP_ATTEMPTS_EXCEEDED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: "VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: []
  /api/v1/auth/password/reset:
    post:
      tags:
      - Authentication
      summary: Set a new password with the reset token from the SMS step or the email
        link; logs out every session
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "400":
          description: "WEAK_PASSWORD: the reset token stays valid | VALIDATION_FAILED:\
            \ errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "RESET_TOKEN_INVALID: unknown, used or expired"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "204":
          description: No Content
      security: []
  /api/v1/auth/password/forgot:
    post:
      tags:
      - Authentication
      summary: Start a password reset by SMS code or email link; same answer whether
        or not the account exists (FR-ID-07)
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        "400":
          description: "INVALID_PHONE | VALIDATION_FAILED: errors lists each invalid\
            \ field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: OTP_RATE_LIMITED; see Retry-After
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: SMS_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PasswordResetStartedResponse"
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Log out by revoking the refresh token and dropping the device's push
        token (FR-ID-05)
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
        required: true
      responses:
        "204":
          description: No Content
        "400":
          description: "VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Log in with the phone number or a verified email (FR-ID-03)
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "400":
          description: "INVALID_PHONE: the identifier is neither an email nor a Vietnamese\
            \ mobile number | VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "INVALID_CREDENTIALS: unknown identifier, unverified email\
            \ or wrong password (identical answers)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "ACCOUNT_SUSPENDED (reason, suspendedUntil) | ACCOUNT_BANNED\
            \ (reason)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: "LOGIN_LOCKED: 5 failures for the identifier or 20 from the\
            \ IP in 15 min; see Retry-After"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: []
  /api/v1/auth/email-verification:
    post:
      tags:
      - Authentication
      summary: Verify the email address with the token from the verification link
        (FR-ID-09)
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
        required: true
      responses:
        "422":
          description: "INVALID_VERIFICATION_TOKEN: unknown, used or expired, or the\
            \ email changed since"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "204":
          description: No Content
        "400":
          description: "VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: []
  /api/v1/areas/{areaId}/renewals:
    post:
      tags:
      - Areas
      summary: Renew an area with a fresh GPS fix within 1 500 m of its center (UC-AR-02)
      operationId: renew
      parameters:
      - name: Idempotency-Key
        in: header
        description: UUID; resending the same key and body returns the stored response
        required: true
        schema:
          type: string
          format: uuid
      - name: areaId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewAreaRequest"
        required: true
      responses:
        "403":
          description: "LOCATION_CONSENT_REQUIRED | ACCESS_DENIED: the account is\
            \ not ACTIVE or has no verified phone"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "AREA_NOT_FOUND: not one of the caller's areas"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "AREA_STATUS_CONFLICT: the area was removed | IDEMPOTENCY_CONFLICT\
            \ | DUPLICATE_REQUEST"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "OUT_OF_RENEW_RADIUS: farther than 1 500 m; distanceMeters\
            \ rounded to 100 m | AREA_VERIFICATION_REJECTED: hard rule broken; reasons\
            \ with guidance"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: "AREA_RATE_LIMITED: reason DAILY_ATTEMPTS; Retry-After header"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: "VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/areas/verifications:
    post:
      tags:
      - Areas
      summary: "Verify a new area, or replace one, with a fresh GPS fix (UC-AR-01,\
        \ UC-AR-03)"
      description: "201 creates an area. 200 means the fix was within 1 500 m of an\
        \ existing area, which was renewed instead (UC-AR-01 A4)."
      operationId: verify
      parameters:
      - name: Idempotency-Key
        in: header
        description: UUID; resending the same key and body returns the stored response
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyAreaRequest"
        required: true
      responses:
        "201":
          description: A new area was verified
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AreaVerificationResponse"
        "200":
          description: An existing area was renewed instead
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AreaVerificationResponse"
        "403":
          description: "LOCATION_CONSENT_REQUIRED: no PRECISE_LOCATION consent | ACCESS_DENIED:\
            \ the account is not ACTIVE or has no verified phone"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "AREA_NOT_FOUND: replaceAreaId is not one of the caller's areas"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "AREA_LIMIT_REACHED: already 2 areas; areaIds lists them for\
            \ UC-AR-03 | AREA_HAS_OPEN_TRANSACTIONS: the replaced area's listings\
            \ have open transactions | AREA_STATUS_CONFLICT: the replaced area was\
            \ removed | IDEMPOTENCY_CONFLICT | DUPLICATE_REQUEST"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "AREA_VERIFICATION_REJECTED: reasons MOCK_LOCATION, LOW_ACCURACY,\
            \ STALE_FIX, IMPOSSIBLE_SPEED with guidance | OUT_OF_RENEW_RADIUS: when\
            \ renewing a nearby area"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: "AREA_RATE_LIMITED: reason DAILY_ATTEMPTS (5 a day) or AREA_CHANGES\
            \ (3 per 30 days); Retry-After header"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: "VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/admin/users/{userId}/unlock:
