          description: Current password
          example: Secret123
          maxLength: 200
          minLength: 0
      required:
      - password
    AccountDeletionResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - BANNED
          - PENDING_DELETION
          - DELETED
        deleteAfter:
          type: string
          format: date-time
    Problem:
      type: object
      additionalProperties: true
      description: "RFC 9457 problem detail. Branch on `code`, never on `detail`.\
        \ Some codes add members: remainingAttempts (OTP_INVALID), reason and suspendedUntil\
        \ (ACCOUNT_SUSPENDED / ACCOUNT_BANNED), nextAllowedAt (NAME_CHANGE_TOO_SOON),\
        \ blockers (ACCOUNT_DELETION_BLOCKED)."
      properties:
        violations:
          type: array
          description: Only for WEAK_PASSWORD
          items:
            type: object
        title:
          type: string
          example: Unprocessable Content
        type:
          type: string
          example: https://nearby.uit.edu.vn/problems/otp-invalid
        status:
          type: integer
          format: int32
          example: 422
        code:
          type: string
          example: OTP_INVALID
        detail:
          type: string
          example: The code is wrong. 4 attempts left.
        errors:
          type: array
          description: Only for VALIDATION_FAILED
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
      required:
      - code
      - status
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
