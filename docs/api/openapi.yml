openapi: 3.1.0
info:
  title: Nearby API
  description: "Hyperlocal second-hand marketplace. Errors follow RFC 9457 (application/problem+json)\
    \ with a stable `code`; lists use cursor-based pagination; state-changing calls\
    \ accept an Idempotency-Key header. Business flows per screen: docs/api/<module>-api.md."
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Consents
  description: Consent per purpose and marketing pushes (FR-ID-15)
- name: Profile
  description: The current user's profile and avatar (FR-ID-03)
- name: Discovery
  description: "Nearby feed, search, map and categories (FR-DC-01..07; A06-A09, A11)"
- name: Listings
  description: "Post and manage listings, listing detail (FR-LS-01..14, FR-DC-08;\
    \ A10, A12, A14)"
- name: Listing images
  description: "Upload listing images; they are checked and re-encoded without EXIF/GPS\
    \ (FR-LS-02, UC-SY-10; A13)"
- name: Authentication
  description: "Phone registration with SMS codes, login, tokens, password reset and\
    \ email verification"
- name: Favorites
  description: "Saved listings (FR-LS-12; A10, A15)"
- name: Account security
  description: "The current user's password, optional email address and account deletion"
- name: Areas
  description: "GPS-verified activity areas (FR-AR-01..09; screens A27, A28)"
- name: Trading gate
  description: "Conditions to post listings, chat and make offers (FR-ID-20)"
- name: Blocks
  description: Block and unblock other users (FR-ID-14)
- name: "Admin: users"
  description: "Find accounts, suspend, ban and lift sanctions (FR-ID-19, UC-AD-04)"
- name: Public profiles
  description: What anyone can see about a user (FR-ID-13)
- name: Location consent
  description: Consent to location data processing (FR-ID-06)
paths:
  /api/v1/users/me:
    get:
      tags:
      - Profile
      summary: Get the current user's profile
      operationId: getProfile
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags:
      - Profile
      summary: Update display name and default area; the area is rounded before it
        is stored
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "422":
          description: "NAME_CHANGE_TOO_SOON: nextAllowedAt says when the name can\
            \ change again"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: "VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags:
      - Account security
      summary: "Delete the account: anonymised after the grace period unless the user\
        \ logs in again (FR-ID-16)"
      operationId: deleteAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
        required: true
      responses:
        "400":
          description: "CURRENT_PASSWORD_INVALID | VALIDATION_FAILED: errors lists\
            \ each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: CANNOT_DELETE_ADMIN
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: ACCOUNT_DELETION_BLOCKED (blockers lists open obligations)
            | ACCOUNT_STATUS_CONFLICT
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "202":
          description: Accepted
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AccountDeletionResponse"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/me/password:
    put:
      tags:
      - Account security
      summary: "Change the password; other devices are logged out, this one stays\
        \ (FR-ID-08)"
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
        required: true
      responses:
        "400":
          description: "CURRENT_PASSWORD_INVALID | PASSWORD_REUSED | WEAK_PASSWORD\
            \ | VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "204":
          description: No Content
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/me/location-consent:
    get:
      tags:
      - Location consent
      summary: Get the current consent and the terms version clients must show
      operationId: getConsent
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LocationConsentResponse"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    put:
      tags:
      - Location consent
      summary: Give consent to the current terms version
      operationId: grantConsent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationConsentRequest"
        required: true
      responses:
        "400":
          description: "OUTDATED_TERMS_VERSION: termsVersion is not the current one\
            \ | VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags:
      - Location consent
      summary: Withdraw consent; precise locations are no longer collected
      operationId: withdrawConsent
      responses:
        "204":
          description: No Content
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/me/email:
    put:
      tags:
      - Account security
      summary: Add or replace the optional email address and send a verification link
        (FR-ID-09)
      operationId: changeEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeEmailRequest"
        required: true
      responses:
        "409":
          description: "EMAIL_UNAVAILABLE: another account uses the address"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "202":
          description: Accepted
        "400":
          description: "VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/me/consents/push-marketing:
    put:
      tags:
      - Consents
      summary: Agree to marketing pushes
      operationId: grantPushMarketing
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ConsentResponse"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags:
      - Consents
      summary: Withdraw consent to marketing pushes
      operationId: withdrawPushMarketing
      responses:
        "204":
          description: No Content
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/me/blocks/{userId}:
    put:
      tags:
      - Blocks
      summary: Block a user; blocking again changes nothing
      operationId: block
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "400":
          description: CANNOT_BLOCK_SELF
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "USER_NOT_FOUND: unknown or deleted account"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "204":
          description: No Content
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags:
      - Blocks
      summary: Unblock a user; unblocking a user who is not blocked changes nothing
      operationId: unblock
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/me/avatar:
    put:
      tags:
      - Profile
      summary: "Step 2 of an avatar change: confirm the uploaded image"
      operationId: confirmAvatar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmAvatarRequest"
        required: true
      responses:
        "400":
          description: "INVALID_AVATAR_KEY | AVATAR_NOT_UPLOADED | INVALID_IMAGE (the\
            \ upload is deleted) | VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags:
      - Profile
      summary: Remove the avatar
      operationId: removeAvatar
      responses:
        "204":
          description: No Content
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/listings/{listingId}:
    get:
      tags:
      - Listings
      summary: "Listing detail with buttons and their reasons (UC-DC-04, A10); counts\
        \ a view"
      description: "Public. The owner also gets the exact pin. lat and lon, when given,\
        \ are where the distance is measured from; otherwise the caller's active area."
      operationId: detail
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: lat
        in: query
        required: false
        schema:
          type: number
          format: double
          maximum: 90.0
          minimum: -90.0
      - name: lon
        in: query
        required: false
        schema:
          type: number
          format: double
          maximum: 180.0
          minimum: -180.0
      responses:
        "404":
          description: "LISTING_NOT_FOUND: deleted, removed, hidden, or between users\
            \ who blocked each other"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: []
    put:
      tags:
      - Listings
      summary: "Edit every field but the area (UC-LS-02, A12)"
      operationId: edit
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditListingRequest"
        required: true
      responses:
        "404":
          description: "LISTING_NOT_FOUND: not one of the caller's listings"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "CONCURRENT_MODIFICATION: reload; currentVersion | INVALID_LISTING_STATE:\
            \ SOLD, REMOVED or DELETED | LISTING_HAS_OPEN_TRANSACTIONS: price change\
            \ while RESERVED; transactionId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: PIN_OUTSIDE_AREA | IMAGE_INVALID | CATEGORY_INACTIVE
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: "VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags:
      - Listings
      summary: "Delete: 404 for everyone afterwards; conversations stay readable (UC-LS-04,\
        \ A14)"
      operationId: delete
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: LISTING_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "LISTING_HAS_OPEN_TRANSACTIONS: an OFFERED or ACCEPTED transaction;\
            \ transactionId | INVALID_LISTING_STATE: SOLD or REMOVED"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "204":
          description: No Content
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/listings/{listingId}/favorite:
    put:
      tags:
      - Favorites
      summary: Save a listing; saving again changes nothing (UC-LS-08)
      operationId: save
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: "LISTING_NOT_FOUND: the listing cannot be seen"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "204":
          description: No Content
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags:
      - Favorites
      summary: Unsave a listing; works on listings that are no longer available (UC-LS-08)
      operationId: unsave
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/areas/active:
    put:
      tags:
      - Areas
      summary: Choose the area that drives the feed and its range (UC-AR-04)
      operationId: selectActive
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectActiveAreaRequest"
        required: true
      responses:
        "400":
          description: "INVALID_RANGE: rangeLevel is not NEAR, MEDIUM or FAR | VALIDATION_FAILED:\
            \ errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "AREA_NOT_FOUND: not one of the caller's areas"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "AREA_STATUS_CONFLICT: only a VERIFIED or EXPIRING area"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/me/email/verification:
    post:
      tags:
      - Account security
      summary: Send a new verification link to the unverified email address (FR-ID-09)
      operationId: resendEmailVerification
      responses:
        "400":
          description: "EMAIL_NOT_SET: the account has no email"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "202":
          description: Accepted
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/users/me/avatar/upload-url:
    post:
      tags:
      - Profile
      summary: "Step 1 of an avatar change: get a presigned upload URL"
      operationId: createAvatarUploadUrl
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarUploadUrlRequest"
        required: true
      responses:
        "400":
          description: "INVALID_IMAGE: not JPEG, PNG or WebP, or over 5 MB | VALIDATION_FAILED:\
            \ errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/listings:
    post:
      tags:
      - Listings
      summary: "Post a listing; it is ACTIVE at once (UC-LS-01, A12)"
      operationId: create
      parameters:
      - name: Idempotency-Key
        in: header
        description: UUID; resending the same key and body returns the stored response
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateListingRequest"
        required: true
      responses:
        "201":
          description: The new listing; Location points to its detail
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OwnerListingResponse"
        "400":
          description: "IDEMPOTENCY_KEY_REQUIRED | VALIDATION_FAILED: errors lists\
            \ each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "TRADING_GATE_FAILED: reasons lists the conditions to fix"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "LISTING_OPEN_LIMIT: 30 open listings already | IDEMPOTENCY_CONFLICT\
            \ | DUPLICATE_REQUEST"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "PIN_OUTSIDE_AREA: the area is not a valid area of the caller\
            \ or the pin is more than 1 500 m from its center | IMAGE_INVALID: an\
            \ image is not the caller's, not READY or used by another listing | CATEGORY_INACTIVE"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: "LISTING_DAILY_LIMIT: 3 listings a day until the first completed\
            \ transaction; remaining, dailyLimit and Retry-After"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/listings/{listingId}/unhide:
    post:
      tags:
      - Listings
      summary: "Show a listing the caller hid (UC-LS-03, A14)"
      operationId: unhide
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
        required: true
      responses:
        "404":
          description: LISTING_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "CONCURRENT_MODIFICATION | INVALID_LISTING_STATE: not HIDDEN,\
            \ or hidden because its area was removed or the account was sanctioned\
            \ (hiddenReason)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: "VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/listings/{listingId}/sold-outside:
    post:
      tags:
      - Listings
      summary: "Mark sold outside the app: no transaction, no review (UC-LS-05 A1,\
        \ A14)"
      operationId: markSoldOutside
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        description: UUID; resending the same key and body returns the stored response
        required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
        required: true
      responses:
        "400":
          description: "IDEMPOTENCY_KEY_REQUIRED | VALIDATION_FAILED: errors lists\
            \ each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: LISTING_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "CONCURRENT_MODIFICATION | INVALID_LISTING_STATE: not ACTIVE\
            \ | IDEMPOTENCY_CONFLICT | DUPLICATE_REQUEST"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/listings/{listingId}/hide:
    post:
      tags:
      - Listings
      summary: "Hide: off the feed, search and map, still in \"Tin của tôi\" (UC-LS-03,\
        \ A14)"
      operationId: hide
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
        required: true
      responses:
        "404":
          description: LISTING_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "CONCURRENT_MODIFICATION | INVALID_LISTING_STATE: not ACTIVE\
            \ | LISTING_HAS_OPEN_TRANSACTIONS: RESERVED; transactionId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: "VALIDATION_FAILED: errors lists each invalid field"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: "UNAUTHENTICATED: missing or expired token"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/listings/{listingId}/bump:
    post:
      tags:
      - Listings
      summary: "Bump to the top of the feed: once per 48 h, 10 times at most (UC-LS-06,\
        \ A14)"
      operationId: bump
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "404":
          description: LISTING_NOT_FOUND
          content:
