              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          description: "2-30 characters, trimmed; changeable once every 30 days"
          example: An Nguyen
          maxLength: 30
          minLength: 2
      required:
      - displayName
    ProfileAreaResponse:
      type: object
      description: One of the caller's areas (FR-ID-12). It never carries coordinates
        (NFR-15)
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          example: Nhà
        localityName:
          type: string
          description: Public neighborhood name; null until known
        status:
          type: string
          description: VERIFIED | EXPIRING | EXPIRED; EXPIRED needs renewal
        active:
          type: boolean
          description: Drives the feed (FR-AR-08)
        expiresAt:
          type: string
          format: date-time
    ProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        email:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        role:
          type: string
          enum:
          - USER
          - ADMIN
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - BANNED
          - PENDING_DELETION
          - DELETED
        areas:
          type: array
          description: "Areas that are not removed, in slot order; empty before the\
            \ first verification"
          items:
            $ref: "#/components/schemas/ProfileAreaResponse"
        phoneVerified:
          type: boolean
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        displayNameChangeAllowedAt:
          type: string
          format: date-time
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          example: Secret123
          maxLength: 200
          minLength: 0
        newPassword:
          type: string
          description: "At least 8 characters, at most 72 UTF-8 bytes, letters and\
            \ digits"
          example: NewSecret456
          maxLength: 200
          minLength: 0
      required:
      - currentPassword
      - newPassword
    LocationConsentRequest:
      type: object
      properties:
        termsVersion:
          type: string
          description: Must equal currentTermsVersion from GET
          example: "1.0"
          maxLength: 20
          minLength: 0
      required:
      - termsVersion
    LocationConsentResponse:
      type: object
      properties:
        granted:
          type: boolean
        termsVersion:
          type: string
        consentedAt:
          type: string
          format: date-time
        withdrawnAt:
          type: string
          format: date-time
        currentTermsVersion:
          type: string
    ChangeEmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: an.nguyen@example.com
          maxLength: 254
          minLength: 0
      required:
      - email
    ConsentResponse:
      type: object
      properties:
        purpose:
          type: string
          enum:
          - TERMS
          - PRIVACY
          - PRECISE_LOCATION
          - PUSH_MARKETING
        granted:
          type: boolean
        policyVersion:
          type: string
        grantedAt:
          type: string
          format: date-time
        withdrawnAt:
          type: string
          format: date-time
    ConfirmAvatarRequest:
      type: object
      properties:
        objectKey:
          type: string
          description: objectKey returned by the upload-url step
          example: avatars/1b0c6f1e-0000-4000-8000-000000000000/7f3e6a2b-0000-4000-8000-000000000000.jpg
          maxLength: 200
          minLength: 0
      required:
      - objectKey
    EditListingRequest:
      type: object
      description: "Every field but the area (UC-LS-02, A12). Send the whole form\
        \ back"
      properties:
        version:
          type: integer
          format: int64
          description: The version the seller edited; a newer one is 409 CONCURRENT_MODIFICATION
        title:
          type: string
          maxLength: 100
          minLength: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        condition:
          type: string
          enum:
          - NEW
          - LIKE_NEW
          - USED
          - WORN
        priceVnd:
          type: integer
          format: int64
          maximum: 1000000000
          minimum: 0
        acceptOffers:
          type: boolean
        meetingSpot:
          type: string
          maxLength: 100
          minLength: 0
        categoryId:
          type: integer
          format: int32
        latitude:
          type: number
          format: double
          description: A moved pin must stay inside the listing's area
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        imageIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
          minItems: 1
      required:
      - categoryId
      - condition
      - imageIds
      - latitude
      - longitude
      - priceVnd
      - title
      - version
    ListingImageResponse:
      type: object
      description: Short-lived URLs of the WebP derivatives; the original is never
        served (FR-LS-02)
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          format: int32
          description: 1 = cover
        thumbnailUrl:
          type: string
          description: 320 px
        largeUrl:
          type: string
          description: 1080 px
    OwnerListingResponse:
      type: object
      description: "The caller's own listing after a change (A12, A14), with its exact\
        \ pin"
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING_REVIEW
          - ACTIVE
          - RESERVED
          - SOLD
          - HIDDEN
          - DELETED
          - REMOVED
        hiddenReason:
          type: string
          description: "OWNER, AREA_REMOVED or SANCTION while HIDDEN"
          enum:
          - OWNER
          - AREA_REMOVED
          - SANCTION
        categoryId:
          type: integer
          format: int32
        areaId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        condition:
          type: string
          enum:
          - NEW
          - LIKE_NEW
          - USED
          - WORN
        priceVnd:
          type: integer
          format: int64
        free:
          type: boolean
        acceptOffers:
          type: boolean
        meetingSpot:
          type: string
        pin:
          $ref: "#/components/schemas/PointResponse"
          description: Exact pin; only ever returned to the owner
        publicPoint:
          $ref: "#/components/schemas/PointResponse"
          description: Blurred point everyone else sees
        localityName:
          type: string
        images:
          type: array
          items:
            $ref: "#/components/schemas/ListingImageResponse"
        views:
          type: integer
          format: int32
        favorites:
          type: integer
          format: int32
        chats:
          type: integer
          format: int32
        bumpCount:
          type: integer
          format: int32
        bumpedAt:
          type: string
          format: date-time
        nextBumpAllowedAt:
          type: string
          format: date-time
          description: When the next bump is allowed; null before the first bump
        publishedAt:
          type: string
          format: date-time
        soldAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Send it back with the next change
    PointResponse:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    SelectActiveAreaRequest:
      type: object
      properties:
        areaId:
          type: string
          format: uuid
        rangeLevel:
          type: string
          description: "NEAR 2 km, MEDIUM 4 km or FAR 6 km"
          enum:
          - NEAR
          - MEDIUM
          - FAR
          example: MEDIUM
          minLength: 1
      required:
      - areaId
      - rangeLevel
    AreaResponse:
      type: object
      description: An area of the caller. It never carries coordinates (NFR-15)
      properties:
        id:
          type: string
          format: uuid
        slot:
          type: integer
          format: int32
          description: 1 or 2
        label:
          type: string
          example: Nhà
        localityName:
          type: string
          description: Public neighborhood name; null until known
        status:
          type: string
          description: VERIFIED and EXPIRING unlock trading; EXPIRED needs renewal
          enum:
          - VERIFIED
          - EXPIRING
          - EXPIRED
          - REMOVED
        rangeLevel:
          type: string
          enum:
          - NEAR
          - MEDIUM
          - FAR
        active:
          type: boolean
          description: Drives the feed (FR-AR-08)
        verifiedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: verifiedAt + 30 days
    AvatarUploadUrlRequest:
      type: object
      properties:
        contentType:
          type: string
          description: "image/jpeg (also image/jpg), image/png or image/webp"
          example: image/jpeg
          maxLength: 50
          minLength: 0
        sizeBytes:
          type: integer
          format: int64
          description: "File size in bytes, at most image.max_bytes (5 MB)"
          example: 204800
          exclusiveMinimum: 0
      required:
      - contentType
    AvatarUploadUrlResponse:
      type: object
      properties:
        objectKey:
          type: string
        uploadUrl:
          type: string
        method:
          type: string
        expiresAt:
          type: string
          format: date-time
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
    CreateListingRequest:
      type: object
      description: "A new listing (UC-LS-01, A12)"
      properties:
        areaId:
          type: string
          format: uuid
          description: One of the caller's VERIFIED or EXPIRING areas; it never changes
        title:
          type: string
          description: 5-100 characters
          example: Áo khoác da nam
          maxLength: 100
          minLength: 0
        description:
          type: string
          description: At most 2 000 characters; line breaks kept
          maxLength: 2000
          minLength: 0
        condition:
          type: string
          enum:
          - NEW
          - LIKE_NEW
          - USED
          - WORN
        priceVnd:
          type: integer
          format: int64
          description: "Whole VND, 0-1 000 000 000; 0 = given away"
          example: 150000
          maximum: 1000000000
          minimum: 0
        acceptOffers:
          type: boolean
          description: "false: offers must match the price (FR-TX-01); default true"
        meetingSpot:
          type: string
          description: At most 100 characters
          example: Cổng KTX khu A
          maxLength: 100
          minLength: 0
        categoryId:
          type: integer
          format: int32
          example: 1
        latitude:
          type: number
          format: double
          description: "Exact pin, private; within 1 500 m of the area center"
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          maximum: 180
          minimum: -180
        imageIds:
          type: array
          description: 1-10 READY image ids in display order; the first is the cover
          items:
            type: string
            format: uuid
          maxItems: 10
          minItems: 1
      required:
      - areaId
      - categoryId
      - condition
      - imageIds
      - latitude
      - longitude
      - priceVnd
      - title
    VersionRequest:
      type: object
      description: "The listing version the seller saw (optimistic lock, FR-LS-13)"
      properties:
        version:
          type: integer
          format: int64
      required:
      - version
    ImageStatusResponse:
      type: object
      description: Poll until READY (use the image) or REJECTED (upload again) (UC-SY-10)
      properties:
        imageId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - UPLOADING
          - READY
          - REJECTED
        rejectReason:
          type: string
          description: Only when REJECTED
          enum:
          - TYPE_MISMATCH
          - UNSUPPORTED_TYPE
          - TOO_LARGE
          - DECODE_ERROR
        thumbnailUrl:
          type: string
          description: "320 px preview, only when READY"
    UploadUrlRequest:
      type: object
      description: "One image to upload (FR-LS-02, A13)"
      properties:
        contentType:
          type: string
          description: "image/jpeg, image/png or image/webp; convert HEIC to JPEG\
            \ first"
          example: image/jpeg
          minLength: 1
        sizeBytes:
          type: integer
          format: int64
          description: At most 5 242 880 bytes
          example: 2048000
          exclusiveMinimum: 0
      required:
      - contentType
      - sizeBytes
    UploadTicketResponse:
      type: object
      description: "Upload the bytes with PUT to uploadUrl and Content-Type = contentType,\
        \ then call complete"
      properties:
        imageId:
          type: string
          format: uuid
        uploadUrl:
          type: string
        uploadMethod:
          type: string
          example: PUT
        contentType:
          type: string
          example: image/jpeg
        expiresAt:
          type: string
          format: date-time
        maxSizeBytes:
          type: integer
          format: int64
    RegisterRequest:
      type: object
      properties:
        phone:
          type: string
          description: "Same number the code was sent to; 0912345678, 84912345678\
            \ or +84912345678"
          example: "0912345678"
          maxLength: 20
          minLength: 0
        challengeId:
          type: string
          format: uuid
          description: From POST /auth/register/otp
        otp:
          type: string
          description: 6-digit SMS code
          example: "123456"
          minLength: 1
          pattern: "[0-9]{6}"
        password:
          type: string
          description: "At least 8 characters, at most 72 UTF-8 bytes, letters and\
            \ digits"
          example: Secret123
          maxLength: 200
          minLength: 0
        displayName:
          type: string
          example: An Nguyen
          maxLength: 30
          minLength: 2
        termsVersion:
          type:
          - string
          - "null"
          description: Accepted Terms version; leave out when not accepted
          example: "1.0"
          maxLength: 20
          minLength: 0
        privacyVersion:
          type:
          - string
          - "null"
          description: Accepted Privacy Policy version; leave out when not accepted
          example: "1.0"
          maxLength: 20
          minLength: 0
        pushMarketing:
          type:
          - boolean
          - "null"
          description: Optional consent to marketing pushes
          example: false
      required:
      - challengeId
      - displayName
      - otp
      - password
      - phone
    RegistrationResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        phone:
          type: string
        tokens:
          $ref: "#/components/schemas/TokenResponse"
    TokenResponse:
      type: object
      properties:
        tokenType:
          type: string
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
    SendOtpRequest:
      type: object
      properties:
        phone:
          type: string
          description: "Vietnamese mobile number; spaces, dots and dashes allowed"
          example: 0912 345 678
          maxLength: 20
          minLength: 0
      required:
      - phone
    OtpChallengeResponse:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
        expiresInSeconds:
          type: integer
          format: int64
        resendAfterSeconds:
          type: integer
          format: int64
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
          example: q3nV7m...
          maxLength: 100
          minLength: 0
      required:
      - refreshToken
    VerifyResetCodeRequest:
      type: object
      properties:
        challengeId:
          type: string
          format: uuid
          description: From POST /auth/password/forgot
        phone:
          type: string
          example: "0912345678"
          maxLength: 20
          minLength: 0
        otp:
          type: string
          example: "123456"
          minLength: 1
          pattern: "[0-9]{6}"
      required:
      - challengeId
      - otp
      - phone
    PasswordResetTokenResponse:
      type: object
      properties:
        resetToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    ResetPasswordRequest:
      type: object
      properties:
        resetToken:
          type: string
          description: From verify-otp or the email link
          maxLength: 100
          minLength: 0
        newPassword:
          type: string
          example: NewSecret456
          maxLength: 200
          minLength: 0
      required:
      - newPassword
      - resetToken
    ForgotPasswordRequest:
      type: object
      properties:
        identifier:
          type: string
          description: Phone number (SMS code) or a verified email (reset link)
          example: "0912345678"
          maxLength: 254
          minLength: 0
      required:
      - identifier
    PasswordResetStartedResponse:
      type: object
      properties:
        channel:
          type: string
        challengeId:
          type: string
          format: uuid
        expiresInSeconds:
          type: integer
          format: int64
        resendAfterSeconds:
          type: integer
          format: int64
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          example: q3nV7m...
          maxLength: 100
          minLength: 0
        fcmToken:
          type:
          - string
          - "null"
          description: Push token of this device; its pushes stop
          maxLength: 300
          minLength: 0
      required:
      - refreshToken
    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          description: Phone number or a verified email
          example: "0912345678"
          maxLength: 254
          minLength: 0
        password:
          type: string
          example: Secret123
          maxLength: 200
          minLength: 0
      required:
      - identifier
      - password
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          description: token query parameter of the email link
          maxLength: 100
          minLength: 0
      required:
      - token
    DeviceSignalsPayload:
      type: object
      description: Device signals read by the app. Send null for a signal that could
        not be read; signals are stored for moderators and never reject the verification
        (FR-AR-05)
      properties:
        emulator:
          type: boolean
          description: Running on an emulator
        rooted:
          type: boolean
          description: The device is rooted
        developerOptions:
          type: boolean
          description: Developer options are on
        mockLocationApp:
          type: boolean
          description: A mock-location app is installed
    RenewAreaRequest:
      type: object
      properties:
        latitude:
          type: number
          format: double
          example: 10.87
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          example: 106.8031
          maximum: 180
          minimum: -180
        accuracyMeters:
          type: number
          format: double
          description: "Horizontal accuracy reported by the OS, in meters; over 100\
            \ is rejected"
          example: 12.5
          minimum: 0
        fixTime:
          type: string
          format: date-time
          description: When the GPS fix was taken; older than 120 s is rejected
          example: 2026-11-22T02:00:00Z
        mockLocation:
          type: boolean
          description: The OS mock-location flag; true is rejected
        deviceSignals:
          $ref: "#/components/schemas/DeviceSignalsPayload"
        appVersion:
          type: string
          example: 1.0.0
          maxLength: 20
          minLength: 0
      required:
      - accuracyMeters
      - fixTime
      - latitude
      - longitude
      - mockLocation
    AreaVerificationResponse:
      type: object
      properties:
        area:
          $ref: "#/components/schemas/AreaResponse"
        renewal:
          type: boolean
          description: True when an existing area was renewed instead of a new one
            created (the fix was within 1 500 m of it)
    VerifyAreaRequest:
      type: object
      properties:
        latitude:
          type: number
          format: double
          example: 10.87
          maximum: 90
          minimum: -90
        longitude:
          type: number
          format: double
          example: 106.8031
          maximum: 180
          minimum: -180
        accuracyMeters:
          type: number
          format: double
          description: "Horizontal accuracy reported by the OS, in meters; over 100\
            \ is rejected"
          example: 12.5
          minimum: 0
        fixTime:
          type: string
          format: date-time
          description: When the GPS fix was taken; older than 120 s is rejected
          example: 2026-11-22T02:00:00Z
        mockLocation:
          type: boolean
          description: The OS mock-location flag; true is rejected
