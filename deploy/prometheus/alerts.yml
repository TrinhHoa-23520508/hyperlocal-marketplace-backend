# Alert rules for the Nearby backend. Without Alertmanager they show as firing in
# Prometheus (/alerts) and in Grafana; add Alertmanager to deliver them by email or chat.
groups:
  - name: nearby-backend
    rules:
      - alert: BackendDown
        expr: up{job="nearby-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nearby backend is not answering /actuator/prometheus"

      - alert: HighServerErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{application="nearby-backend", status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count{application="nearby-backend"}[5m])), 1e-9)
            > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of API requests fail with 5xx"

      - alert: SlowResponses
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{application="nearby-backend", uri!~"/ws.*"}[5m])))
            > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 API latency is above 1 s (NFR target)"

      - alert: HeapAlmostFull
        expr: |
          sum(jvm_memory_used_bytes{application="nearby-backend", area="heap"})
            / sum(jvm_memory_max_bytes{application="nearby-backend", area="heap"} > 0)
            > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap is more than 90% used"

      - alert: DatabasePoolExhausted
        expr: max(hikaricp_connections_pending{application="nearby-backend"}) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Requests are waiting for a database connection"

      - alert: LoginOrOtpAbuse
        expr: |
          sum(rate(http_server_requests_seconds_count{application="nearby-backend", status="429",
            uri=~"/api/v1/auth/.*"}[5m])) * 60 > 30
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Many rate-limited auth requests (possible brute force or SMS abuse)"
